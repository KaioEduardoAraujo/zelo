# Keep-alive do Supabase (plano gratuito pausa o projeto depois de ~7 dias sem uso).
# A cada 3 dias chama a função `ping()` (migration 0011) com a chave PÚBLICA: é uma consulta
# real no Postgres, que não lê nem escreve dado algum.
#
# Configure em Settings → Secrets and variables → Actions:
#   SUPABASE_URL                 https://<projeto>.supabase.co
#   SUPABASE_PUBLISHABLE_KEY     a chave publishable (sb_publishable_...) ou anon
name: Keep-alive do Supabase

on:
  schedule:
    - cron: "17 12 */3 * *" # 09:17 em Brasília, a cada 3 dias
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consultar o banco
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Configure os secrets SUPABASE_URL e SUPABASE_PUBLISHABLE_KEY."
            exit 1
          fi
          resposta=$(curl -fsS --retry 3 --retry-delay 10 -X POST \
            "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')
          echo "Resposta: $resposta"
          test "$resposta" = '"ok"'
